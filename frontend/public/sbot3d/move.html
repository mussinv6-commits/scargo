.row:last-child{border:0}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.st{font-variant-numeric:tabular-nums}

.pop.on{opacity:1}

@media(max-width:640px){.hud{position:static;width:auto;max-width:none;border-radius:0;border-width:1px 0 0}.stage{display:flex;flex-direction:column}canvas{flex:1;min-height:320px}}
