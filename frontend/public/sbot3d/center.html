function noiseTex(base,lite,dark,size,speck,rx,ry){const c=document.createElement('canvas');c.width=c.height=size;const g=c.getContext('2d');g.fillStyle=base;g.fillRect(0,0,size,size);
 for(let k=0;k<26;k++){const x=Math.random()*size,y=Math.random()*size,r=size*(.08+Math.random()*.2),gg=g.createRadialGradient(x,y,0,x,y,r);const cc=Math.random()<.5?lite:dark;gg.addColorStop(0,cc+'33');gg.addColorStop(1,cc+'00');g.fillStyle=gg;g.fillRect(x-r,y-r,r*2,r*2)}
 for(let i=0;i<speck;i++){g.fillStyle=(Math.random()<.5?lite:dark)+(Math.random()<.5?'55':'99');g.fillRect(Math.random()*size,Math.random()*size,1+Math.random()*2,1+Math.random()*2)}

const hillMat=new THREE.MeshLambertMaterial({color:0x5d7a55}),lineWhite=new THREE.MeshBasicMaterial({color:0xe9e9e9,side:THREE.DoubleSide});
(function(){let sd=11;const r=()=>{sd=(sd*16807)%2147483647;return sd/2147483647};
 for(let i=0;i<46;i++){const a=Math.PI*(1.05+r()*.9),R=170+r()*110;const h=new THREE.Mesh(new THREE.SphereGeometry(1,18,10),hillMat);h.scale.set(40+r()*60,14+r()*26,30+r()*40);h.position.set(Math.cos(a)*R*1.5,0,Math.sin(a)*R*.9-30);scene.add(h)}})();

const winMats=[];
function wallMat(len,h,css){const cw=512,ch=Math.max(96,Math.round(cw*h/len));const c=document.createElement('canvas');c.width=cw;c.height=ch;const g=c.getContext('2d');
 for(let x=0;x<cw;x+=10){g.fillStyle=(x/10)%2?'#a7acb6':'#bcc1c9';g.fillRect(x,0,10,ch)}
 g.fillStyle='#6f7580';g.fillRect(0,ch*.9,cw,ch*.1);g.fillStyle=css;g.fillRect(0,ch*.58,cw,ch*.1);
 const e=document.createElement('canvas');e.width=cw;e.height=ch;const q=e.getContext('2d');q.fillStyle='#000';q.fillRect(0,0,cw,ch);
 const n=Math.max(3,Math.round(len/2.4)),ww=cw/n*.55,wh=ch*.13;
 for(let i=0;i<n;i++){const x0=(i+.2)*cw/n,y0=ch*.14;g.fillStyle='#27384f';g.fillRect(x0,y0,ww,wh);if(Math.random()<.7){q.fillStyle='#ffd98a';q.fillRect(x0,y0,ww,wh)}}
 const t=new THREE.CanvasTexture(c),te=new THREE.CanvasTexture(e);t.anisotropy=AN;
 const m=new THREE.MeshLambertMaterial({map:t,emissive:0xffffff,emissiveMap:te,emissiveIntensity:.03});winMats.push(m);return m}

 const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),depthTest:false}));s.scale.set(scale*4,scale,1);s.renderOrder=5;return s}
// ---- 센터 3곳 (건물/하역구/야적장은 허브 HTML 의 building() 방식 그대로, 하역구는 앞쪽(+z)) ----
const pick=[];
CEN.forEach(c=>{
 const w=14,d=9,h=4.2,css=c.css,x=c.x,z=c.z;
 const yard=new THREE.Mesh(new THREE.PlaneGeometry(24,22),asphMat(5,4.6));yard.rotation.x=-Math.PI/2;yard.position.set(x,.015,z+3);yard.receiveShadow=true;scene.add(yard);
 const roof=new THREE.MeshLambertMaterial({color:0x8d939c}),mz=wallMat(w,h,css),mx=wallMat(d,h,css);
 const bm=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),[mx,mx,roof,roof,mz,mz]);bm.position.set(x,h/2,z);bm.castShadow=true;bm.receiveShadow=true;scene.add(bm);bm.userData.c=c;pick.push(bm);
 box(w+.1,.35,.25,0xa5abb4,x,h+.17,z-d/2);box(w+.1,.35,.25,0xa5abb4,x,h+.17,z+d/2);box(.25,.35,d,0xa5abb4,x-w/2,h+.17,z);box(.25,.35,d,0xa5abb4,x+w/2,h+.17,z);
 box(2.2,.8,1.6,0x9aa0a8,x+w*.18,h+.4,z+d*.2);box(1.6,.6,1.6,0x9aa0a8,x-w*.2,h+.3,z-d*.18);
 [-4,0,4].forEach(dx=>{box(3.0,2.4,.25,0x353b46,x+dx,1.2,z+d/2+.05);box(3.5,.2,1.1,0x4a505c,x+dx,2.7,z+d/2+.55);box(3.0,.12,.22,0xe3b505,x+dx,.12,z+d/2+.14)});
 const lb=label(c.name,css,1.9);lb.position.set(x,h+3.4,z);scene.add(lb);
 const f=new THREE.Group();f.position.set(x,.16,z+3);scene.add(f);
 [[0,-11.3,24.4,.4],[0,11.3,24.4,.4],[-12.2,0,.4,22.4],[12.2,0,.4,22.4]].forEach(a=>{const m=new THREE.Mesh(new THREE.BoxGeometry(a[2],.12,a[3]),new THREE.MeshBasicMaterial({color:0xf3d27a,transparent:true,opacity:0}));m.position.set(a[0],0,a[1]);f.add(m)});
 c.frame=f;
});
// ---- 실제 입지처럼 꾸미기: 물류센터는 시가지 바깥쪽. 택배차는 곤지암 허브 → 간선도로 → 센터별 진입로 → 출입구 → 앞마당(하역구) ----
// 서울 양재동(도시 외곽 · 경부고속도로 뒤편 · 양재천) / 경기 화성 정남(농지 · 소규모 공장) / 인천 남동공단 고잔동(공단 · 서해)
let sd=7;const rnd=()=>{sd=(sd*16807)%2147483647;return sd/2147483647};
const TZ=44; // 간선도로 z 위치 (모든 센터 진입로가 여기로 합류)
const inYard=(x,z,o,m)=>Math.abs(x-o.x)<12+m&&Math.abs(z-(o.z+3))<11+m;
const onRoad=(x,z,o,m)=>Math.abs(x-o.x)<4+m&&z>o.z+10&&z<TZ+4;
const onTrunk=(z,m)=>Math.abs(z-TZ)<7+m;
const ok=(x,z,w,d)=>{const m=Math.max(w,d)/2+2;return !CEN.some(o=>inYard(x,z,o,m)||onRoad(x,z,o,m))&&!onTrunk(z,m)};
function patch(x,z,w,d,mat,y){const m=new THREE.Mesh(new THREE.PlaneGeometry(w,d),mat);m.rotation.x=-Math.PI/2;m.position.set(x,y||.03,z);m.receiveShadow=true;scene.add(m);return m}
const lineW=new THREE.MeshBasicMaterial({color:0xe9e9e9,side:2}),lineY=new THREE.MeshBasicMaterial({color:0xe3b505,side:2});
function lane(x,z,len,vertical,mat){for(let i=1;i<len;i+=3){const d=new THREE.Mesh(new THREE.PlaneGeometry(vertical?.2:1.4,vertical?1.4:.2),mat||lineW);d.rotation.x=-Math.PI/2;d.position.set(vertical?x:x-len/2+i,.07,vertical?z-len/2+i:z);scene.add(d)}}
const treeM=new THREE.MeshLambertMaterial({color:0x2f6b3a}),trunkM=new THREE.MeshLambertMaterial({color:0x5a4030});
function tree(x,z,s){s=s||1;const a=new THREE.Mesh(new THREE.CylinderGeometry(.18*s,.24*s,1.2*s,6),trunkM);a.position.set(x,.6*s,z);const b=new THREE.Mesh(new THREE.ConeGeometry(1.3*s,3.4*s,8),treeM);b.position.set(x,2.6*s,z);b.castShadow=true;scene.add(a,b)}
const bulbM=new THREE.MeshBasicMaterial({color:0x8a8f99}),lampSprites=[];
const glowTex=(()=>{const c=document.createElement('canvas');c.width=c.height=64;const g=c.getContext('2d'),r=g.createRadialGradient(32,32,0,32,32,32);r.addColorStop(0,'rgba(255,233,168,1)');r.addColorStop(.35,'rgba(255,220,140,.45)');r.addColorStop(1,'rgba(255,220,140,0)');g.fillStyle=r;g.fillRect(0,0,64,64);return new THREE.CanvasTexture(c)})();
function lamp(x,z){box(.14,3.4,.14,0x555a66,x,1.7,z);const b=new THREE.Mesh(new THREE.BoxGeometry(.7,.14,.3),bulbM);b.position.set(x,3.45,z);scene.add(b);
 const s=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex,transparent:true,opacity:0,depthWrite:false,blending:THREE.AdditiveBlending}));s.position.set(x,3.3,z);s.scale.set(7,7,1);scene.add(s);lampSprites.push(s);
 const pool=new THREE.Mesh(new THREE.CircleGeometry(3.2,16),new THREE.MeshBasicMaterial({map:glowTex,transparent:true,opacity:0,depthWrite:false,blending:THREE.AdditiveBlending}));pool.rotation.x=-Math.PI/2;pool.position.set(x,.09,z);scene.add(pool);lampSprites.push(pool)}
function tag(txt,css,x,y,z,w){const l=label(txt,css);l.position.set(x,y,z);l.scale.set(w*4,w,1);scene.add(l)}
const shed=[0x9aa3ad,0xb4a58c,0x8e99a6];
// 디테일 있는 건물: 창문 줄무늬 벽 · 옥상 난간 · 옥상 설비 · 출입문 · 필요하면 층 띠
function bld(x,z,w,d,h,css,roofC,door){
 const roof=new THREE.MeshLambertMaterial({color:roofC||0x8d939c}),mz=wallMat(w,h,css),mx=wallMat(d,h,css);
 const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),[mx,mx,roof,roof,mz,mz]);m.position.set(x,h/2,z);m.castShadow=true;m.receiveShadow=true;scene.add(m);
 const pc=0xa5abb4;box(w+.1,.35,.25,pc,x,h+.17,z-d/2);box(w+.1,.35,.25,pc,x,h+.17,z+d/2);box(.25,.35,d,pc,x-w/2,h+.17,z);box(.25,.35,d,pc,x+w/2,h+.17,z);
 box(Math.min(2.2,w*.28),.8,Math.min(1.6,d*.22),0x9aa0a8,x+w*.18,h+.4,z-d*.15);box(1.2,.6,1.2,0x9aa0a8,x-w*.2,h+.3,z+d*.12);

 if(door){box(2.2,2.2,.2,0x2a3140,x,1.1,z+d/2+.05);box(3,.25,1,0x4a505c,x,2.4,z+d/2+.5)}
}
const GG=CEN[0],SE=CEN[1],IC=CEN[2];
// 간선도로: 곤지암 허브 방면(동쪽)에서 들어와 서쪽으로 이어진다
patch(2,TZ,150,12,asphMat(26,2),.03);box(150,.4,.3,0x8a8f99,2,.2,TZ-6);box(150,.4,.3,0x8a8f99,2,.2,TZ+6);lane(2,TZ,148,false,lineY);

CEN.forEach(c=>{
 patch(c.x,c.z+3,24,22,asphMat(6,5.4),.02);
 for(let i=-4;i<=4;i++){const s=new THREE.Mesh(new THREE.PlaneGeometry(.15,3.4),lineW);s.rotation.x=-Math.PI/2;s.position.set(c.x+i*2.4,.06,c.z+10.2);scene.add(s)}
 box(24,1.2,.25,0x8a8f99,c.x,.6,c.z-8);box(.25,1.2,22,0x8a8f99,c.x-12,.6,c.z+3);box(.25,1.2,22,0x8a8f99,c.x+12,.6,c.z+3);
 box(9,1.2,.25,0x8a8f99,c.x-7.5,.6,c.z+14);box(9,1.2,.25,0x8a8f99,c.x+7.5,.6,c.z+14);

 box(2.2,2.4,2.2,0xcfd4dc,c.x+6.5,1.2,c.z+12.6);box(2.4,.25,2.4,0x4a505c,c.x+6.5,2.5,c.z+12.6);box(1.2,.9,.1,0x9fc4e8,c.x+6.5,1.5,c.z+11.45); // 경비실

// 서울 양재동: 도시 외곽 — 양옆에 중층 건물

[[-26,-6,9,8,12],[26,-6,8,9,16],[-26,10,9,9,10],[28,12,8,8,14],[26,28,9,8,9],[-12,34,8,7,8],[-26,-16,8,8,18],[26,-14,9,8,11]].forEach((a,i)=>{const x=SE.x+a[0],z=SE.z+a[1];if(ok(x,z,a[2],a[3])&&Math.abs(x-(SE.x-36))>7)bld(x,z,a[2],a[3],a[4],cityC[i%5],0x8d939c,true)});

// 경기 화성 정남: 외곽 농공지대 — 소규모 공장 · 숲
[[-30,-4,12,8],[32,-6,14,8],[-32,22,10,7],[34,24,12,7]].forEach((a,i)=>{const x=GG.x+a[0],z=GG.z+a[1];if(ok(x,z,a[2],a[3]))bld(x,z,a[2],a[3],4.5,['#6d747e','#8a6a4a','#5f7a8c','#7a7f88'][i],shed[i%3],true)});

[[-32,0,12,8],[-32,16,12,8],[32,0,12,8],[32,16,12,8],[-48,8,11,8],[48,8,11,8]].forEach((a,i)=>{const x=IC.x+a[0],z=IC.z+a[1];if(ok(x,z,a[2],a[3]))bld(x,z,a[2],a[3],5.5,['#6d747e','#5f7a8c','#8a6a4a'][i%3],shed[i%3],true)});
for(let i=0;i<10;i++){const x=IC.x+(rnd()-.5)*70,z=IC.z+20+rnd()*10;if(ok(x,z,3,3))tree(x,z,.7)}
function setSel(c,on){c.frame.children.forEach(m=>m.material.opacity=on?1:0)}
// ---- 주간/야간 (허브 HTML 의 updEnv 방식) ----
const mixc=(a,b,n)=>new THREE.Color(a).lerp(new THREE.Color(b),n);
function updEnv(n){scene.background=mixc('#9cc3ee','#0c1834',n);scene.fog.color.copy(mixc('#cfe0f2','#0c1834',n));ground.material.color.copy(mixc('#ffffff','#1a2038',n));hillMat.color.copy(mixc('#6f8d66','#0f1830',n));hemi.color.copy(mixc('#ffffff','#7f9fe0',n));hemi.groundColor.copy(mixc('#6f7f6a','#0e1424',n));hemi.intensity=.95-.7*n;sun.intensity=.9-.72*n;sun.color.copy(mixc('#ffffff','#7f95d0',n));asphMats.forEach(m=>m.color.copy(mixc('#ffffff','#3b4260',n)));winMats.forEach(m=>m.emissiveIntensity=.03+.9*n);bulbM.color.copy(mixc('#8a8f99','#fff1c0',n));lampSprites.forEach(s=>s.material.opacity=n*.85)}
// 하루 시계: 택배 이동 화면과 같은 시각(localStorage sbot_clock)을 따른다. 이동 화면이 꺼져 있으면 낮 12시부터 혼자 흐른다
const T0=Date.now(),pad2=v=>String(v).padStart(2,'0');
function nightF(h){if(h>=19.5||h<5.5)return 1;if(h>=7.5&&h<17.5)return 0;if(h>=17.5)return (h-17.5)/2;return 1-(h-5.5)/2}
function curTod(){try{let c=JSON.parse(localStorage.getItem('sbot_clock')||'null');if(!(c&&typeof c.tod==='number'&&typeof c.rate==='number')){c={tod:12,at:Date.now(),rate:.2};localStorage.setItem('sbot_clock',JSON.stringify(c))}return(((c.tod+(Date.now()-c.at)/1000*c.rate)%24)+24)%24}catch(e){return(12+(Date.now()-T0)/1000*.2)%24}}
const clk=document.createElement('span');clk.style.cssText='margin-left:12px;font-size:14px;font-weight:600;color:#e9ebef';document.getElementById('top').appendChild(clk);
let lastN=-1;
function envTick(){const h=curTod(),n=nightF(h);clk.textContent='시각 '+pad2(Math.floor(h))+':'+pad2(Math.floor(h%1*60))+(n>.5?' · 밤':' · 낮');if(Math.abs(n-lastN)<.01)return;lastN=n;updEnv(n)}
setInterval(envTick,400);envTick();
// 카메라 이동: 센터를 누르면 그 센터로 부드럽게 다가가고, '전체 보기'로 처음 시점으로 돌아간다
let fly=null;
function flyTo(p,t){fly={p0:cam.position.clone(),t0:ctl.target.clone(),p1:p,t1:t,s:performance.now(),d:1100}}
const OV={p:new THREE.Vector3(-8,88,84),t:new THREE.Vector3(-10,0,-8)};
function focus(c){flyTo(new THREE.Vector3(c.x+16,36,c.z+44),new THREE.Vector3(c.x,2,c.z))}
const ob=document.createElement('button');ob.textContent='전체 보기';ob.style.cssText='position:absolute;left:16px;top:60px;border:1px solid #2a3a58;border-radius:7px;background:#222833;color:#e6eff7;padding:6px 14px;cursor:pointer;font:inherit;font-size:13px';ob.onclick=()=>flyTo(OV.p.clone(),OV.t.clone());document.body.appendChild(ob);
// ---- 패널 ----
const P=document.getElementById('panel'),F=n=>n.toLocaleString();
// 센터 정보는 공용 데이터(shared.js: 택배 이동 화면이 도착할 때마다 기록)를 읽는다. 없으면 예시값.
const KEYS={GG:'GGI',SE:'SEL',IC:'ICN'};let cur=null;
function data(c){const s=window.SBOT&&SBOT.load().centers[KEYS[c.id]];if(s)return s;const base=(c.jae+c.min)*c.trips;return {trips:c.trips,items:c.items,base,fin:Math.round(base*.5),hr:c.hr,cat:c.cat,trucks:c.trk.map((n,i)=>({no:n,state:i<c.done?'입고 완료':'이동 중',items:0}))}}
function show(c){cur=c;CEN.forEach(o=>setSel(o,false));setSel(c,true);
 const s=data(c),mx=Math.max(1,...s.hr),cm=Math.max(1,...s.cat),dis=s.base-s.fin,nb=Math.min(s.base,s.nb||0),nightN=Math.min(s.trips,s.nn||0),dayN=s.trips-nightN,nightAmt=Math.max(0,nb-dis),dayAmt=Math.max(0,s.base-nb),done=s.trucks.filter(t=>t.state==='입고 완료').length,avg=Math.round(s.base/Math.max(1,s.trips));
 P.style.display='block';P.innerHTML=`<h3>${c.name} · 오늘</h3>
 <div class="k"><div><small>배정 택배차</small><b>${s.trucks.length}대</b></div><div><small>입고 완료</small><b>${done}대</b></div><div><small>운송 물품</small><b>${s.items}건</b></div></div>
 <div class="sec">시간대별 입고 (건)</div><div class="bars">${s.hr.map(v=>`<i class="${v==mx?'pk':''}" style="height:${v/mx*100}%"></i>`).join('')}</div><div class="lab">${HRL.map(h=>`<span>${h}</span>`).join('')}</div>
 <div class="sec">운송 물품 구성</div>${s.cat.map((v,i)=>`<div class="row"><span>${CATL[i]}</span><div style="width:${v/cm*130}px"></div><em>${v}</em></div>`).join('')}
 <div class="sec">하루 합산 통행료 (${s.trips}회)</div>
 <div class="row"><span>주간 ${dayN}회</span><div style="width:${dayAmt/Math.max(1,s.base)*130}px"></div><em>${F(dayAmt)}원</em></div>
 <div class="row g"><span>심야 ${nightN}회</span><div style="width:${nightAmt/Math.max(1,s.base)*130}px"></div><em>${F(nightAmt)}원</em></div>
 <div class="mut2">${nightN>0?`심야 기본 ${F(nb)}원 - 할인 ${F(dis)}원`:'심야 통과 없음'} · 주간은 기본 요금 그대로</div>
 <div class="row t"><span>합계</span><div style="width:${s.fin/Math.max(1,s.base)*130}px"></div><em>${F(s.fin)}원</em></div>
 <div class="tk"><div class="sec" style="margin:0">배정 택배차</div>${s.trucks.map(t=>`${t.no} · ${t.state}${t.items?' · '+t.items+'건':''}`).join('<br>')}</div>`}
setInterval(()=>{if(cur)show(cur)},1500);addEventListener('storage',()=>{if(cur)show(cur)});
const ray=new THREE.Raycaster(),mv=new THREE.Vector2();let dn=null;
renderer.domElement.addEventListener('pointerdown',e=>dn=[e.clientX,e.clientY]);
renderer.domElement.addEventListener('pointerup',e=>{if(!dn||Math.hypot(e.clientX-dn[0],e.clientY-dn[1])>5)return;mv.set(e.clientX/W()*2-1,-(e.clientY/H())*2+1);ray.setFromCamera(mv,cam);const h=ray.intersectObjects(pick)[0];if(h){show(h.object.userData.c);focus(h.object.userData.c)}});
addEventListener('resize',()=>{renderer.setSize(W(),H());cam.aspect=W()/H();cam.updateProjectionMatrix()});
const qc=new URLSearchParams(location.search).get('c');{const c0=CEN.find(c=>c.id===({GGI:'GG',SEL:'SE',ICN:'IC'})[qc]);show(c0||CEN[1]);if(c0)focus(c0)}
// ---- 택배차 운행 (26.10.25): 곤지암 허브 → 간선도로 → 센터 진입로 → 출입구 → 앞마당 → 후면(뒷문) 도킹 → 하역 → 출차 ----
// 차량 앞(운전석)은 로컬 +z, 뒷문은 -z. 도크로는 뒷문이 먼저 들어가게 후진해서 붙는다
const TRP=80, TR=[];
function mkTruck(c,plate){
 const g=new THREE.Group(),L=(w,h,d,col,x,y,z)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshLambertMaterial({color:col}));m.position.set(x,y,z);m.castShadow=true;g.add(m);return m};
 L(2.5,2.5,3.7,0xf4f6f8,0,2.05,-0.75);            // 짐칸
 L(2.56,.5,3.7,c.col,0,1.15,-0.75);               // 센터 색 띠
 L(2.5,.1,.1,0x2a3140,0,2.05,-2.62);              // 뒷문 틈
 L(2.3,1.9,1.5,0xe9edf2,0,1.75,1.85);             // 운전석
 L(2.0,.7,.06,0x9fc4e8,0,2.2,2.62);               // 앞유리
 L(2.5,.35,5.5,0x3a3f4a,0,.75,.1);                // 하부
 [[-1.25,-1.4],[1.25,-1.4],[-1.25,1.5],[1.25,1.5]].forEach(a=>{const w=new THREE.Mesh(new THREE.CylinderGeometry(.5,.5,.35,12),new THREE.MeshLambertMaterial({color:0x15171c}));w.rotation.z=Math.PI/2;w.position.set(a[0],.5,a[1]);g.add(w)});
 const lb=label(plate,c.css,.9);lb.position.set(0,4.4,0);g.add(lb);
 g.visible=false;scene.add(g);return g}
function kf(c,dx,idx){
 const X=c.x,Z=c.z,s=[],sp=12;let t=0;const add=(x,z,h,dur)=>{if(s.length){const p=s[s.length-1];t+=dur!=null?dur:Math.hypot(x-p.x,z-p.z)/sp}s.push({t,x,z,h})};
 // 26.10.25 수정: 일반도로에서는 앞을 보고 곡선으로 꺾어 진입로로 → 앞마당에서 U턴 → 뒷문부터 후진으로 도크에 붙음 → 앞으로 출차
 //  차는 자기 방향(h)으로만 움직인다. 옆으로 미끄러지지 않도록 모든 구간을 '직진 · 원호'로 이어 붙인다 (도크 3곳마다 미리 계산한 값)
 const PI=Math.PI, R=2.8, sgp={"-4":{s:-1,phi:3.14,L:5.9,Rr:3.5},"0":{s:-1,phi:2.02,L:.5,Rr:3.5},"4":{s:1,phi:2.38,L:2.1,Rr:3.5}}[dx]||{s:-1,phi:3.14,L:5.9,Rr:3.5};
 const pp={x:1.6,z:14,h:-PI}, H0=sgp.s<0?0:-2*PI;
 const seg=(g,dist,dh)=>{const n=Math.max(1,Math.ceil(dist/.8)),ds=dist/n;for(let i=0;i<n;i++){pp.h+=dh/n/2;pp.x+=g*Math.sin(pp.h)*ds;pp.z+=g*Math.cos(pp.h)*ds;pp.h+=dh/n/2;add(X+pp.x,Z+pp.z,pp.h,ds/(g>0?10:4.5))}};
 add(78,TZ+2.2,-PI/2);add(X+6,TZ+2.2,-PI/2);                             // 간선도로를 달려 진입로 앞까지
 add(X+3.0,TZ+0.8,-PI*0.75,1.0);add(X+1.6,TZ-2.2,-PI,.8);                // 앞을 보고 곡선으로 꺾어 진입로로
 add(X+1.6,Z+16,-PI);add(X+1.6,Z+14,-PI);                                // 진입로를 따라 출입구 통과
 seg(1,R*sgp.phi,sgp.s<0?sgp.phi:-sgp.phi);                              // 앞마당에서 U턴
 seg(-1,sgp.L,0);                                                        // 뒤로 직진
 {const dh=H0-pp.h;seg(-1,Math.abs(dh)*sgp.Rr,dh)}                       // 후진하며 방향을 맞춰 도크에 뒷문을 붙임
 pp.h=H0;pp.x=dx;pp.z=8.1;s[s.length-1].x=X+dx;s[s.length-1].z=Z+8.1;s[s.length-1].h=H0;
 const hold=t+8;s.push({t:hold,x:X+dx,z:Z+8.1,h:H0});t=hold;             // 하역
 {const D=-1.6-dx;if(Math.abs(D)>.05){const be=Math.acos(1-Math.abs(D)/(2*4.5)),sn=D>0?1:-1;seg(1,4.5*be,sn*be);seg(1,4.5*be,-sn*be)}} // 앞으로 나가며 출차 차선으로
 pp.h=H0;seg(1,(TZ-5.5-Z)-pp.z,0);                                       // 출차 차선을 따라 간선도로 쪽으로
 seg(1,3.3*PI/2,PI/2);add(78,TZ-2.2,H0+PI/2);                            // 허브 방면으로 돌아감
 return s}
CEN.forEach(c=>{c.trk.forEach((p,i)=>{const dx=[-4,0,4][i%3];TR.push({c,m:mkTruck(c,p),k:kf(c,dx,i),off:i*TRP/c.trk.length+(c.id==='SE'?0:c.id==='GG'?22:44)})})});
const lerpA=(a,b,u)=>a+(b-a)*u;
function truckStep(){const now=performance.now()/1000;TR.forEach(o=>{const tt=((now+o.off)%TRP),K=o.k,end=K[K.length-1].t;if(tt>end){o.m.visible=false;return}
 let i=0;while(i<K.length-2&&tt>K[i+1].t)i++;const a=K[i],b=K[i+1],u=b.t>a.t?Math.min(1,Math.max(0,(tt-a.t)/(b.t-a.t))):1;
 o.m.visible=true;o.m.position.set(lerpA(a.x,b.x,u),0,lerpA(a.z,b.z,u));o.m.rotation.y=lerpA(a.h,b.h,u)})}

(function loop(){requestAnimationFrame(loop);truckStep();if(fly){let k=Math.min(1,(performance.now()-fly.s)/fly.d);k=k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;cam.position.lerpVectors(fly.p0,fly.p1,k);ctl.target.lerpVectors(fly.t0,fly.t1,k);if(k>=1)fly=null}ctl.update();renderer.render(scene,cam)})();
