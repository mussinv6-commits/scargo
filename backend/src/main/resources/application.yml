spring:
  application:
    name: scargo

  # 26.10.06 추가: DevTools 자동 재시작 끄기
  # (STS 에서 파일이 바뀔 때마다 백엔드가 몰래 재시작 → 로그인 세션이 날아가 "로그인이 필요합니다"가 반복되던 원인)
  # 코드를 고친 뒤에는 STS 에서 직접 재시작(Relaunch)하면 됨
  devtools:
    restart:
      enabled: false

  # PostgreSQL 연결 설정
  datasource:
    url: jdbc:postgresql://localhost:5432/scargo
    username: postgres
    password: '1234'
    driver-class-name: org.postgresql.Driver

  # JPA 및 Hibernate 설정
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: true

# [FCM 비활성화 26.09.30] Firebase 설정 주석 처리 (다시 쓰려면 주석 해제)
# # Firebase Cloud Messaging 설정
# # firebase 콘솔 > 프로젝트 설정 > 서비스 계정 > "새 비공개 키 생성" 으로 받은 json 파일을
# # src/main/resources/firebase/service-account.json 경로에 넣어주세요. (git에는 올리지 말 것)
# firebase:
#   credentials-path: classpath:firebase/service-account.json
#   enabled: true

# 26.10.01 추가: 재시작할 때 이전 로그인 세션을 파일에서 되살리지 않음
# (DevTools 재시작 시 "Cannot deserialize session attribute [SPRING_SECURITY_CONTEXT]" /
#  "Exception loading sessions from persistent storage" 오류가 찍히던 문제 - 재시작 후에는 다시 로그인)
server:
  servlet:
    session:
      persistent: false
      # 26.10.06 추가: 기본 30분 → 12시간 (시연 중 가만히 있어도 로그인이 풀리지 않게)
      timeout: 12h
