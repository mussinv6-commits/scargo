plugins {
    id 'java'
    id 'eclipse' 
    id 'org.springframework.boot' version '3.3.0' 
    id 'io.spring.dependency-management' version '1.1.5' 
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
    sourceCompatibility = '17' 
}

repositories {
    mavenCentral()
}

dependencies {
    // 웹 및 MVC 환경
    implementation 'org.springframework.boot:spring-boot-starter-web'       
    implementation 'org.springframework.boot:spring-boot-starter-tomcat'   

    // 데이터베이스 및 MyBatis 연동
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'       
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:3.0.3' 
    implementation 'org.mybatis:mybatis:3.5.19'                              
    runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly 'com.h2database:h2' // 26.10.20 추가: PostgreSQL 없이 기동 확인용 (--spring.profiles.active=h2)                                 

    // JPA 설정
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // QueryDSL 설정 (Spring Boot 3.x / Jakarta 패키지 적용)

    // 보안 및 유효성 검증
    implementation 'org.springframework.boot:spring-boot-starter-security'   
    implementation 'org.springframework.boot:spring-boot-starter-validation' 

    // 데이터 직렬화
    implementation 'com.fasterxml.jackson.core:jackson-databind'           

    // [FCM 비활성화 26.09.30] Firebase Cloud Messaging (모바일 푸시 알림) - 다시 쓰려면 아래 주석 해제
    // implementation 'com.google.firebase:firebase-admin:9.10.0'

    // 개발 편의 및 설정 도구
    developmentOnly 'org.springframework.boot:spring-boot-devtools'         
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor' 
    
    // 롬복(Lombok) 의존성 설정
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    
    // 화면 렌더링 및 지도 연동
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'  

    // 테스트 도구
    testImplementation 'org.springframework.boot:spring-boot-starter-test'  
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher' // 26.10.20: Gradle 9 는 런처를 자동 추가하지 않음

    // 스웨거 연동(api 문서화) — 26.10.21 v4 병합(팀장 v3)
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.2.0'
}

tasks.named('test') {
    useJUnitPlatform() 
}

tasks.withType(JavaCompile) {
    options.compilerArgs << "-parameters"
}

// 26.10.20: QueryDSL 제거 (LoadingRecord 검색을 JPQL 로 교체) → Q클래스 생성/IDE 소스경로 설정 불필요

// 26.10.30 런처 시작 단축용: 실행 클래스패스를 인자 파일로 저장 → java @build/run.args 로 gradle 없이 바로 기동
tasks.register('writeRunArgs') {
    dependsOn 'classes'
    doLast {
        // 프로젝트 폴더 경로에 한글이 있으면 java 인자 파일에서 깨지므로 상대 경로로 바꿈 (실행 위치 = backend/scargo)
        def cp = sourceSets.main.runtimeClasspath.asPath.replace(projectDir.absolutePath + File.separator, '').replace('\\', '\\\\')
        file("${buildDir}/run.args").text = '-cp "' + cp + '"\n'
    }
}
