# 26.10.20 추가: PostgreSQL 없이 서버 기동만 확인하는 프로필 (데이터는 메모리, 재시작하면 사라짐)
#   ./gradlew bootRun --args='--spring.profiles.active=h2'
spring:
  datasource:
    url: jdbc:h2:mem:scargo;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: ''
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    show-sql: false

# H2 에는 DB 트리거가 없으므로 같은 알림을 서비스가 대신 만든다
scargo:
  db-notify-triggers: false
