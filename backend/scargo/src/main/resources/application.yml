spring:
  application:
    name: scargo

  # PostgreSQL 연결 설정
  datasource:
    url: jdbc:postgresql://localhost:5432/scargo
    username: postgres
    password: '1234'
    driver-class-name: org.postgresql.Driver

  # JPA 및 Hibernate 설정
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: true

# [FCM 비활성화 26.09.30] Firebase 설정 주석 처리 (다시 쓰려면 주석 해제)
