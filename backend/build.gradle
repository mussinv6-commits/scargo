plugins {
    id 'java'
    id 'eclipse' 
    id 'org.springframework.boot' version '3.3.0' 
    id 'io.spring.dependency-management' version '1.1.5' 
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
    sourceCompatibility = '17' 
}

repositories {
    mavenCentral()
}

dependencies {
    // 웹 및 MVC 환경
    implementation 'org.springframework.boot:spring-boot-starter-web'       
    implementation 'org.springframework.boot:spring-boot-starter-tomcat'   

    // 데이터베이스 및 MyBatis 연동
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'       
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:3.0.3' 
    implementation 'org.mybatis:mybatis:3.5.19'                              
    runtimeOnly 'org.postgresql:postgresql'                                 

    // JPA 설정
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // QueryDSL 설정 (Spring Boot 3.x / Jakarta 패키지 적용)
    implementation 'com.querydsl:querydsl-jpa:5.0.0:jakarta'
    annotationProcessor 'com.querydsl:querydsl-apt:5.0.0:jakarta'
    annotationProcessor 'jakarta.annotation:jakarta.annotation-api'
    annotationProcessor 'jakarta.persistence:jakarta.persistence-api'

    // 보안 및 유효성 검증
    implementation 'org.springframework.boot:spring-boot-starter-security'   
    implementation 'org.springframework.boot:spring-boot-starter-validation' 

    // 데이터 직렬화
    implementation 'com.fasterxml.jackson.core:jackson-databind'           

    // [FCM 비활성화 26.09.30] Firebase Cloud Messaging (모바일 푸시 알림) - 다시 쓰려면 아래 주석 해제
    // implementation 'com.google.firebase:firebase-admin:9.10.0'

    // 개발 편의 및 설정 도구
    developmentOnly 'org.springframework.boot:spring-boot-devtools'         
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor' 
    
    // 롬복(Lombok) 의존성 설정
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    
    // 화면 렌더링 및 지도 연동
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'  

    // 테스트 도구
    testImplementation 'org.springframework.boot:spring-boot-starter-test'  
}

tasks.named('test') {
    useJUnitPlatform() 
}

tasks.withType(JavaCompile) {
    options.compilerArgs << "-parameters"
}

// ==========================================
// QueryDSL QClass 생성 위치 및 빌드 설정
// ==========================================
def querydslDir = layout.buildDirectory.dir("generated/querydsl").get().asFile

sourceSets {
    main.java.srcDirs += [ querydslDir ]
}

tasks.withType(JavaCompile) {
    options.generatedSourceOutputDirectory = file(querydslDir)
}

clean {
    delete file(querydslDir)
}

// ==========================================
// Eclipse / STS IDE 자동 경로 인식 추가 설정
// ==========================================
eclipse {
    classpath {
        file {
            whenMerged { classpath ->
                // 생성된 QueryDSL 폴더를 소스 경로(Source Folder)로 등록
                def container = new org.gradle.plugins.ide.eclipse.model.SourceFolder(querydslDir.path, null)
                classpath.entries.add(container)
            }
        }
    }
}