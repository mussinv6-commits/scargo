<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>계측 이력</title>
<style>
  .wg{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
  .wg .card{padding:12px 14px}
  .wg .n{font-size:28px;font-weight:800;line-height:1.2}
  .wg .l{font-size:12px;color:#5b6479}
  .rt{position:relative;height:158px;margin:4px 14px 0}
  .rt .band{position:absolute;top:66px;left:0;right:0;height:22px;border-radius:11px;background:#e3e8f4;overflow:hidden;display:flex}
  .rt .seg{height:100%;display:flex;align-items:center;justify-content:center;font-size:10px;color:#475069;white-space:nowrap;overflow:hidden;border-right:2px solid #fff;box-sizing:border-box}
  .rt .done{position:absolute;top:0;left:0;height:100%;background:rgba(19,32,63,.28);pointer-events:none}
  .rt .mk{position:absolute;top:69px;width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid #9aa6c4;transform:translateX(-50%);z-index:2;box-sizing:border-box}
  .rt .mk.ok{background:#2fa66a;border-color:#0b6b3a}.rt .mk.cau{background:#f5a300;border-color:#c2570c}.rt .mk.bad{background:#e5483b;border-color:#b42318}
  .rt .mk.skip{border-style:dashed;background:#f4f5f9}.rt .mk.end{border-radius:3px}
  .rt .lb{position:absolute;font-size:11px;line-height:1.3;text-align:center;white-space:nowrap}
  .rt .lb b{font-size:12px}
  .rt .veh{position:absolute;top:42px;transform:translateX(-50%);background:#1d4ed8;color:#fff;font-size:11px;font-weight:700;border-radius:99px;padding:1px 9px;z-index:3;white-space:nowrap}
  .rt .veh.dev{background:#b42318}.rt .veh:after{content:'';position:absolute;left:calc(50% - 4px);bottom:-4px;border:4px solid transparent;border-top-color:inherit;border-bottom:0}
  .pc{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin-top:10px}
  .pc>div{border:1px solid #e3e6ee;border-radius:8px;padding:8px 10px;font-size:12px;background:#fbfcfe}
  .pc .nm{font-weight:700;font-size:13px}.pc .big{font-size:18px;font-weight:800}
</style>
</head>
<body>
<div id="nav"></div>
<main>
  <h1 style="margin:0;font-size:22px">계측 이력 <span class="sub" style="font-weight:400">도로공사 연계로 받은 계측·통행료 결과</span></h1>
  <div id="demo"></div>
  <div id="rangeBar" style="display:flex;gap:6px;align-items:center;flex-wrap:wrap"></div>
  <div id="err" class="sub" style="color:#b42318"></div>
  <section class="wg" id="wg"></section>
  <section class="card">
    <h3>차량별 경로 타임라인 <span id="tlwho" class="sub" style="font-weight:400"></span></h3>
    <div id="tl"></div>
  </section>
  <section class="card">
    <div style="display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:8px">
      <h3 style="margin:0">계측 기록</h3><span class="sub">차량(운행) 1건당 1행</span><span id="tabs" style="display:flex;gap:6px;margin-left:8px"></span>
      <span class="sub" style="margin-left:auto">정상 = 기준 이내 · 주의 = 기준 초과, 허용 오차(10%) 이내 · 확정 = 허용 오차 초과</span>
    </div>
    <div id="log"></div>
    <div id="pager" style="display:flex;gap:10px;align-items:center;justify-content:center;margin-top:10px"></div>
  </section>
</main>
<script src="/common.js"></script>
<script>
const COLS = '84px 112px repeat(3,minmax(78px,1fr)) 52px minmax(130px,1.5fr)';
const LTAB = [['all', '전체'], ['NORMAL', '정상'], ['CAUTION', '주의'], ['CONFIRMED', '확정']];
const PAGE = 10;
let tab = 'all', page = 1, sel = null, busy = false, again = false, data = { trips: [], issues: [] };

setupChrome('gate', { refresh: load, selectedPid: () => sel, onStarted: k => { sel = k; } });

function widgets() {
  const T = data.trips, lv = k => T.filter(t => t.level === k).length;
  const moving = T.filter(t => !isDone(t) && !isHalted(t)).length, halted = T.filter(isHalted).length;
  const pend = T.reduce((a, t) => a + (isDone(t) ? 0 : t.pending), 0);
  const exp = T.reduce((a, t) => a + (tollOf(t).now || 0), 0), fine = T.reduce((a, t) => a + Number(t.fine_manwon || 0), 0);
  const w = (n, l, sub, cls) => `<div class="card"><div class="n" ${cls ? `style="color:${cls}"` : ''}>${n}</div><div class="l">${l}</div>${sub ? `<div class="sub">${sub}</div>` : ''}</div>`;
  document.getElementById('wg').innerHTML =
    w(T.length + '대', '출차한 차량', `운행 ${moving} · 중지 ${halted} · 완료 ${T.filter(isDone).length}`) + w(lv('NORMAL') + '대', '정상', '', '#0b6b3a') + w(lv('CAUTION') + '대', '주의', '기준 초과·오차 이내', '#c2570c') +
    w(lv('CONFIRMED') + '대', '확정', '허용 오차 초과', '#b42318') + w(pend + '건', '권고 대기', pend ? '차량 관제에서 권고 발송' : '대기 중인 권고 없음', pend ? '#b42318' : '') +
    w(won(exp), '예상 통행료 합계', `도로공사 통보 과태료 ${fine}만원`) + w(data.issues.length + '건', '출차 확인 필요', data.issues.length ? 'OCR 실패·미등록' : '', data.issues.length ? '#c2570c' : '');
}

let MD = null;
api('/api/map/data').then(d => { MD = d; render(); }).catch(() => {});
const pct = km => Math.max(0, Math.min(100, km / ROUTE_KM_TOTAL * 100));
function timeline(t) {
  const el = document.getElementById('tl');
  if (!t) { el.innerHTML = '<div class="empty">차량이 없습니다. 위의 "인천항 출차 (OCR)"를 눌러 보세요.</div>'; document.getElementById('tlwho').textContent = ''; return; }
  const pos = posOf(t), ps = t.point_list, evs = t.route_events || [];
  const rr = t.actions.find(a => a.action_type === 'REROUTE_ADVISE');
  const dev = evs.some(e => e.kind === 'DEVIATE'), back = evs.some(e => e.kind === 'RETURN'), devLive = pos.status === 'DEVIATING';
  document.getElementById('tlwho').innerHTML = `· <span class="plate" style="font-size:12px;padding:0 7px">${esc(t.vehicle_no)}</span> ${lvPill(t.level)} ${pill(pos.state[0], pos.state[1])}${rr ? ' ' + pill('org', '대안 경로 안내됨') : ''} <span class="sub">계획 경로(출발 전 등록) ${ROUTE_KM_TOTAL}km · 실제 이동은 위치로 확인</span>`;
  const segs = (MD && MD.segments) || [{ from_km: 0, to_km: ROUTE_KM_TOTAL, name: '전 구간', road: '' }];
  const cols = ['#d5def2', '#c3cfe9', '#d5def2'];
  let h = '<div class="rt"><div class="band">' + segs.map((g, i) => `<div class="seg" style="width:${pct(g.to_km) - pct(g.from_km)}%;background:${cols[i % 3]}" title="${esc(g.road)}">${esc(g.name)}</div>`).join('') + `<div class="done" style="width:${pct(pos.km)}%"></div></div>`;
  const mk = (km, cls, extra = '') => `<span class="mk ${cls}" style="left:${pct(km)}%" ${extra}></span>`;
  const lab = (km, top, html, al) => `<div class="lb" style="left:${pct(km)}%;top:${top}px;transform:translateX(${al === 'l' ? '0' : al === 'r' ? '-100%' : '-50%'})">${html}</div>`;
  h += mk(0, 'ok') + lab(0, 96, '<b>인천항 출차</b><br><span class="sub">0 km · ' + (t.quote ? clk(new Date(t.quote.departed_at)) + ' 출발' : '') + '</span>', 'l');
  ps.forEach(p => {
    const cls = p.final ? (p.level === 'CONFIRMED' ? 'bad' : p.level === 'CAUTION' ? 'cau' : 'ok') : p.skipped ? 'skip' : '';
    h += mk(p.km, cls) + lab(p.km, 2, `<b>${esc(p.name)}</b><br><span class="sub">${p.km} km · ${p.final ? lvPill(p.level).replace('class="pill', 'class="pill') : p.skipped ? '미통과(우회)' : '예정 ' + clk(passAt(t, p.km))}</span>`);
  });
  h += mk(ROUTE_KM_TOTAL, pos.status === 'ARRIVED' ? 'ok end' : 'end') + lab(ROUTE_KM_TOTAL, 96, `<b>성남IC 진출 · 곤지암 허브</b><br><span class="sub">${ROUTE_KM_TOTAL} km · ${pos.status === 'ARRIVED' ? '도착' : '예정 ' + clk(passAt(t, ROUTE_KM_TOTAL))}</span>`, 'r');
  const vp = pct(pos.km), vtf = vp > 85 ? 'translateX(-100%)' : vp < 8 ? 'translateX(0)' : 'translateX(-50%)';
  h += `<div class="veh${devLive ? ' dev' : ''}" style="left:${vp}%;transform:${vtf}">${esc(t.vehicle_no)} ${pos.km.toFixed(1)}km</div></div>`;
  const dep = t.departure;
  const card = (nm, km, body) => `<div><div class="nm">${nm}</div><div class="sub">${km}</div>${body}</div>`;
  let c = card('인천항 출차', '0 km', `<div>${t.quote ? clk(new Date(t.quote.departed_at)) + ' 출발' : ''}</div><div class="sub">번호판 OCR ${dep && dep.plate_confidence != null ? Number(dep.plate_confidence).toFixed(1) + '%' : t.plate_confidence != null ? Number(t.plate_confidence).toFixed(1) + '%' : '—'} · 여기서 한 번만 인식</div>`);
  ps.forEach(p => {
    const f = p.final;
    c += f ? card(esc(p.name), p.km + ' km', `<div class="big" style="color:${p.level === 'CONFIRMED' ? '#b42318' : 'inherit'}">${tons(f.total_weight_kg)} <span class="sub">/ ${tons(t.limit_kg)}</span></div>
      <div>${lvPill(p.level)} <span class="sub">최대 축 ${tons(Math.max(...f.axles))}</span></div><div class="sub">${hms(f.checked_at)} 계측${p.retest ? ' (재측정 포함)' : ''}</div><div style="margin-top:2px">${esc(pointNote(p))}</div>`)
      : p.skipped ? card(esc(p.name), p.km + ' km', '<div class="sub">경로 이탈로 지나지 않음 — 이 톨게이트 통행료는 발생하지 않습니다</div>')
      : card(esc(p.name), p.km + ' km', `<div class="sub">예정 ${clk(passAt(t, p.km))} · ${t.status === 'HALTED' ? '정차로 도달하지 못함' : '아직 도달 전'}</div>`);
  });
  el.innerHTML = h + `<div class="pc">${c}</div><div class="sub" style="margin-top:8px">현재 위치 ${pos.km.toFixed(1)} / ${ROUTE_KM_TOTAL} km · ${esc(pos.state[1])}${devLive ? ` (경로선에서 ${pos.dist_m >= 1000 ? (pos.dist_m / 1000).toFixed(1) + 'km' : pos.dist_m + 'm'})` : ''} · 선 위 거리는 실제 km 에 비례합니다. 도로 구간 이름은 톨게이트 위치로 나눈 대략값입니다.</div>`;
}

function render() {
  const T = data.trips;
  if (!T.some(t => t.trip_id === sel)) sel = T.length ? T[0].trip_id : null;
  widgets();
  timeline(T.find(t => t.trip_id === sel));
  const memo = t => {
    const evs = t.route_events || [], out = [];
    if (evs.some(e => e.kind === 'DEVIATE')) out.push((evs.some(e => e.kind === 'RETURN') ? '경로 이탈 후 복귀' : '경로 이탈') + (MD && MD.detour_len_km ? ` · 우회 약 ${MD.detour_len_km}km` : ''));
    t.point_list.forEach(p => { if (p.skipped) out.push(`${p.name} 미통과(우회) · 통행료 없음`); else { const n = pointNote(p); if (n) out.push(`${p.name}: ${n}`); } });
    return out;
  };
  const when = t => { const x = (t.quote && t.quote.departed_at) || t.entered_at || ''; return String(x).slice(5, 10) + ' ' + hm(x); };
  const cnt = k => T.filter(t => k === 'all' || t.level === k).length;
  document.getElementById('tabs').innerHTML = LTAB.map(([k, l]) => `<button class="tab ${tab === k ? 'on' : ''}" data-t="${k}" style="padding:4px 12px">${l} ${cnt(k)}</button>`).join('');
  document.querySelectorAll('#tabs .tab').forEach(b => b.onclick = () => { tab = b.dataset.t; page = 1; render(); });
  const list = T.filter(t => tab === 'all' || t.level === tab).sort((a, b) => new Date((b.quote && b.quote.departed_at) || b.entered_at) - new Date((a.quote && a.quote.departed_at) || a.entered_at));
  const pages = Math.max(1, Math.ceil(list.length / PAGE)); if (page > pages) page = pages;
  const shown = list.slice((page - 1) * PAGE, page * PAGE);
  const cell = p => p.skipped ? '<span class="sub">미통과</span>' : p.final ? `${tons(p.final.total_weight_kg)} ${lvPill(p.level)}` : '<span class="sub">—</span>';
  document.getElementById('log').innerHTML = `<div class="row h" style="grid-template-columns:${COLS}"><span>출발</span><span>차량</span><span>인천 과적검문소</span><span>남인천TG</span><span>청계TG</span><span>판정</span><span>비고</span></div>` +
    (shown.length ? shown.map(t => `<button class="row ${t.trip_id === sel ? 'sel' : ''}" data-k="${t.trip_id}" style="grid-template-columns:${COLS}"><span>${when(t)}</span>
      <span><span class="plate" style="font-size:11px;padding:0 6px">${esc(t.vehicle_no)}</span></span>${t.point_list.map(p => `<span>${cell(p)}</span>`).join('')}<span>${lvPill(t.level)}</span>
      <span class="sub" style="line-height:1.5">${memo(t).map(esc).join('<br>') || '—'}</span></button>`).join('') : '<div class="empty">계측 기록이 없습니다</div>');
  document.querySelectorAll('#log button.row').forEach(b => b.onclick = () => { sel = Number(b.dataset.k); render(); });
  document.getElementById('pager').innerHTML = list.length <= PAGE ? `<span class="sub">총 ${list.length}건</span>` :
    `<button class="tab" id="pgP" ${page <= 1 ? 'disabled' : ''}>‹ 이전</button><span class="sub">${page} / ${pages} 쪽 · 총 ${list.length}건</span><button class="tab" id="pgN" ${page >= pages ? 'disabled' : ''}>다음 ›</button>`;
  const pp = document.getElementById('pgP'), pn = document.getElementById('pgN');
  if (pp) pp.onclick = () => { page--; render(); }; if (pn) pn.onclick = () => { page++; render(); };
}

async function load() {
  if (busy) { again = true; return; } busy = true;
  try {
    data = await api('/api/db/overview?' + rangeQuery());
    setSim(data.sim);
    document.getElementById('err').textContent = '';
    render(); stamp();
  } catch (e) { document.getElementById('err').textContent = 'DB 조회 실패: ' + e.message; }
  busy = false;
  if (again) { again = false; load(); }
}
mountRange(document.getElementById('rangeBar'), () => { sel = null; page = 1; load(); });
load(); setInterval(load, 3000);
</script>
</body>
</html>
